<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiteScout — Web GIS Ekspansi Cabang</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>📍 SiteScout</h1>
      <p class="subtitle">Web GIS Ekspansi Cabang</p>
    </div>
    <div class="step-section">
      <div class="step-label">Langkah 1 — Pilih Jenis Usaha</div>
      <select id="bisnis-select">
        <option value="">— Pilih jenis usaha —</option>
        <option value="apotek">💊 Apotek</option>
        <option value="minimarket">🏪 Minimarket</option>
        <option value="restoran">🍽️ Restoran</option>
        <option value="klinik">🏥 Klinik</option>
        <option value="kantor">🏢 Kantor</option>
      </select>
    </div>
    <div id="variable-section" class="step-section" style="display:none;">
      <div class="step-label">Langkah 2 — Atur Variabel</div>
      <div id="variabel-container"></div>
    </div>
    <div id="generate-section" class="step-section" style="display:none;">
      <button id="btn-generate" class="btn-primary">🚀 Generate Wilayah Potensial</button>
    </div>
    <div id="results-section" class="step-section" style="display:none;">
      <div class="step-label">Hasil Analisis</div>
      <div id="results-summary"></div>
      <button id="btn-export" class="btn-secondary">📥 Export Titik Potensial (CSV)</button>
      <button id="btn-reset" class="btn-reset">↺ Reset Titik</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="legend">
    <div class="legend-title">Skor Kesesuaian</div>
    <div class="legend-item"><span class="legend-color" style="background:#1a9850"></span>Sangat Sesuai</div>
    <div class="legend-item"><span class="legend-color" style="background:#91cf60"></span>Sesuai</div>
    <div class="legend-item"><span class="legend-color" style="background:#fee08b"></span>Cukup</div>
    <div class="legend-item"><span class="legend-color" style="background:#fc8d59"></span>Kurang Sesuai</div>
    <div class="legend-item"><span class="legend-color" style="background:#d73027"></span>Tidak Sesuai</div>
  </div>
  <script src="js/variables.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
